name: validate

# 站点数据校验：每个 PR 与 main 推送自动运行。
# 目的：在合并前拦截合并级错误（JS 语法、编号断档/重复、指错文献的链接、
# sitemap 缺漏、计数不符等），把「人眼审查」升级为「机器强制」。
# 2026-11-01（ops）：push 触发器原本只覆盖 main，而 main 有分支保护、Bot 推不进去，
# 等于这条触发器形同虚设——Bot 当日分支推上去之后，校验要等到开出 PR 才第一次跑。
# 故障因此总在「PR 已开、CI 已红」时才暴露，多绕一轮。补上 bot/** 让分支落地即校验。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'bot/**']

# 同一分支连续推送（修完再推是常态）时取消上一轮未跑完的校验，省机器也省排队。
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 运行站点数据校验
        run: python3 tools/validate.py

      # 2026-10-31 新增：并行写入冲突门禁。
      # 当日 content 与 deep 各自改了 search.html 与 benchmarks.html，双方互不知情，
      # 导致缺逗号故障被制造两遍、Cascade 卡片被重复收录。此步骤把撞车从
      # 「合并时人工解冲突」提前到「建 PR 时机器拦截」。
      # API 不可用时脚本降级放行（宁漏勿误伤），不会因网络问题误拦正常 PR。
      - name: 并行写入冲突门禁
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          python3 tools/preflight_conflicts.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --self-branch "${{ github.head_ref }}"
