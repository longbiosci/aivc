function render(){
  const kw=q.value.trim().toLowerCase();
  box.innerHTML='';
  if(!kw){hint.textContent='索引共 '+IDX.length+' 条，输入关键词开始检索。';return}
  const hits=IDX.filter(e=>(e.t+e.d+e.k+e.s).toLowerCase().includes(kw));
  hint.textContent='找到 '+hits.length+' 条结果';
  hits.forEach(e=>{
    const d=document.createElement('div');d.className='hit';
    d.innerHTML='<div class="s">'+e.s+'</div><a href="'+e.u+'">'+e.t+'</a><p>'+e.d+'</p>';
    box.appendChild(d);
  });
}
