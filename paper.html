if(b&&n){b.addEventListener('click',function(){n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open')?'true':'false')});
n.addEventListener('click',function(e){if(e.target.tagName==='A'){n.classList.remove('open')}});}})();

  <div class="crumb" style="font-size:12px;color:var(--dim);margin:26px 0 18px"><a href="/papers" style="color:var(--accent)">文献库</a> / <span id="gname"></span></div>

<script src="assets/papers-data.js"></script>
<script>
(function(){
var G={g1:'纲领与路线图',g2:'单细胞基础模型',g3:'扰动响应预测',g4:'批评与基准',g5:'关键数据集',g6:'经典基线方法',g7:'空间与多组学',g8:'衰老交叉'};
var id=new URLSearchParams(location.search).get('id');
var i=PAPERS.findIndex(function(p){return p.id===id});
var app=document.getElementById('app');
if(i<0){app.innerHTML='<h1>未找到该文献</h1><p><a href="/papers">返回文献库</a></p>';return}
var p=PAPERS[i];
document.getElementById('gname').textContent=G[p.g]||'';
document.title=p.t+' · 文献解读 · AIVC Insight';
var links='<a class="dbtn" href="https://doi.org/'+p.doi+'" target="_blank">DOI 原文</a>';
if(p.pdf)links+='<a class="dbtn" href="'+p.pdf+'" target="_blank">PDF 全文</a>';
var sec=function(h,x){return x?'<h3>'+h+'</h3><p>'+x+'</p>':''};
var rel=PAPERS.filter(function(q,j){return q.g===p.g&&j!==i}).slice(0,5);
var html='<article class="detail">'
+'<div class="dbadge">'+G[p.g]+' · '+p.v+' · '+p.d+'</div>'
+'<h1>'+p.t+'</h1>'
+'<div class="dauth">'+p.a+'</div>'
+'<div class="dlinks">'+links+'</div>'
+'<div class="dsum">'+p.summary+'</div>'
+sec('它解决什么问题',p.problem)
+sec('方法',p.method)
+sec('结果与数据',p.findings)
+sec('局限与争议',p.limits)
+sec('情报点评',p.takeaway)
+'</article>';
if(rel.length){html+='<div class="drel"><h3>同组相关文献</h3><ul>'+rel.map(function(q){return '<li><a href="/paper?id='+q.id+'">'+q.t+'</a><span>'+q.v+' · '+q.d+'</span></li>'}).join('')+'</ul></div>'}
var prev=PAPERS[i-1],next=PAPERS[i+1];
html+='<div class="dpn">'+(prev?'<a href="/paper?id='+prev.id+'">← 上一篇：'+prev.t.slice(0,30)+'…</a>':'<span></span>')+(next?'<a href="/paper?id='+next.id+'">下一篇：'+next.t.slice(0,30)+'… →</a>':'<span></span>')+'</div>';
app.innerHTML=html;
})();
</script>
</body>
</html>
